[package]
name = "pillow-control"
version = "0.2.0"
description = "枕控 PillowControl"
authors = ["PillowControl contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.98"

[lib]
name = "pillow_control"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
include_dir = "0.7"
getrandom = "0.3"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
tauri-plugin-autostart = "2"
winreg = "0.10.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.28"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "unwind"
